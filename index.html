<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja de texto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Escribe aqui tu mensaje</h2>
    <div class="box" id="box">
        <textarea id="mensaje" placeholder="Start typing ..." maxlength="250"></textarea>
        <span id="contador">0/250</span>
    </div>
    <script src="javascript.js" defer></script>
</body>

</html>
